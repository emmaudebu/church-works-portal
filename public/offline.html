<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1A1A1A">
    <title>Offline · Covenant Workforce</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; background: #1A1A1A; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
        img { width: 140px; height: auto; }
        h1 { margin: 24px 0 8px; font-family: Georgia, serif; font-size: 28px; }
        .rule { width: 64px; height: 2px; margin: 0 auto 16px; background: #D4AF37; }
        p { margin: 0 auto; max-width: 320px; color: #C0C0C0; line-height: 1.5; }
        button { margin-top: 24px; padding: 12px 20px; border: 0; border-radius: 8px; background: #B81C19; color: #fff; font: 600 14px system-ui, sans-serif; cursor: pointer; }
        button:focus-visible { outline: 2px solid #E3C76A; outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <img src="/images/logo-dark.png" alt="Church logo">
        <h1>You're offline</h1>
        <div class="rule"></div>
        <p>Covenant Workforce needs a connection. Please check your data or Wi-Fi and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
